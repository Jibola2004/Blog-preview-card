<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png"> 
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
   <div class="blog-container">
    <div class="box-container">
      <img src="blog-preview-card-main/assets/images/illustration-article.svg" alt="illustration-article-svg">
    </div>
    <div class="content-container">
      <div class="badge">
        Learning
      </div>
      <p id="published-date">Published 21 Dec 2023</p>
      <h2 class="title">HTML & CSS foundations</h2>
      <p class="text-content">These language are the backbone of every website,defining structure,content, and presentation.</p>

      <div class="box-footer">
        <div class="avatar">
          <img src="blog-preview-card-main\assets\images\image-avatar.webp" alt="avatar">
        </div>
        <label>Greg Hooper</label>
      </div>
    </div>
   </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Odetola Fathiu Ajibola</a>.
  </footer>
</body>
</html>
